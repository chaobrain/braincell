# Runs the full CI (CI.yml) once a day against the latest dependency
# releases, so an upstream release that breaks braincell shows up even on a
# day without pull requests. Pull requests run CI.yml directly.

name: Daily CI Tests

on:
  schedule:
    # 00:00 UTC every day.
    - cron: '0 0 * * *'
  workflow_dispatch:

# The called workflow cannot hold more than these. No concurrency group here:
# CI.yml sets one, and the same group on caller and callee deadlocks.
permissions:
  contents: read  # to fetch code
  actions: write  # to cancel previous workflows

jobs:
  ci:
    uses: ./.github/workflows/CI.yml

  probe:
    runs-on: ubuntu-latest
    steps:
      - run: exit 1

  # Keeps one open issue labelled `main-is-red` while the daily run is red:
  # opens it on the first red run, comments on later ones, and closes it on
  # the next green run. A run from another branch (manual dispatch) reports
  # under the title "<branch> is red", so a test run never touches the issue
  # about main. Keep `needs` listing every job above.
  report:
    needs: [ci, probe]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read  # to list the failed jobs
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NEEDS: ${{ toJSON(needs) }}
      REF_NAME: ${{ github.ref_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open, update or close the red issue
        run: |
          set -euo pipefail
          label=main-is-red
          # Red when any job in `needs` did not succeed.
          RESULT=$(jq -r 'if all(.[]; .result == "success") then "success"
            else ([.[].result] | map(select(. != "success")) | first) end' <<<"$NEEDS")
          title="$REF_NAME is red"
          gh label create "$label" --color B60205 \
            --description "The daily CI run is red" 2>/dev/null || true
          number=$(gh issue list --label "$label" --state open --limit 100 \
            --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")

          if [ "$RESULT" = success ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "Green again: $RUN_URL (commit $GITHUB_SHA)."
            fi
            exit 0
          fi

          failed=$(gh run view "$GITHUB_RUN_ID" --json jobs \
            --jq '.jobs[] | select(.conclusion == "failure") | "- " + .name')
          body="The daily CI run finished with result \`$RESULT\`.

          - Run: $RUN_URL
          - Commit: $GITHUB_SHA
          - Ref: $REF_NAME

          Failed jobs:
          ${failed:-none (the run was cancelled or timed out)}

          Fixing this is the first task of the day. The issue closes by itself on the next green run."

          if [ -z "$number" ]; then
            gh issue create --title "$title" --label "$label" --body "$body"
          else
            gh issue comment "$number" --body "$body"
          fi
