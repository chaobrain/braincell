# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Continuous Integration

# Runs on every pull request, on each merge-queue group (merge_group: main
# plus the queued pull requests, which is what the queue merges), and on main
# after a merge. The daily workflow (CI-daily.yml) calls this same file, so
# both test one definition. A `push: '**'` trigger would test every pull
# request twice: push and pull_request runs fall into different concurrency
# groups.
on:
  push:
    branches: [ main ]
  pull_request:
  merge_group:
  workflow_call:


permissions:
  contents: read  # to fetch code
  actions: write  # to cancel previous workflows


# This is what will cancel the workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  # Every pre-commit hook on every file (.pre-commit-config.yaml): ruff,
  # formatting, and the repository checks.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pre-commit
        run: python -m pip install "pre-commit>=2.8"
      - name: Run every hook on every file
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Require every tested Python version to be a declared classifier
        run: |
          python -m pip install pyyaml
          python - <<'EOF'
          import tomllib
          import yaml

          def tested(node):
              # Every `python-version` value in the workflow, lists and scalars.
              if isinstance(node, dict):
                  for key, value in node.items():
                      if key == "python-version":
                          for v in value if isinstance(value, list) else [value]:
                              if "{{" not in str(v):  # a matrix expression
                                  yield str(v)
                      else:
                          yield from tested(value)
              elif isinstance(node, list):
                  for item in node:
                      yield from tested(item)

          with open(".github/workflows/CI.yml") as f:
              ci = set(tested(yaml.safe_load(f)))
          with open("pyproject.toml", "rb") as f:
              classifiers = tomllib.load(f)["project"]["classifiers"]
          prefix = "Programming Language :: Python :: "
          declared = {c[len(prefix):] for c in classifiers
                      if c.startswith(prefix) and c[len(prefix):].startswith("3.")}
          print("tested in CI.yml:", sorted(ci))
          print("classifiers:     ", sorted(declared))
          if not ci or not ci <= declared:
              raise SystemExit(
                  f"CI.yml tests Python versions missing from the classifiers: {sorted(ci - declared)}")
          EOF

  # Exercise the packaging path on every push. Publish.yml only builds on a
  # release, so before this job existed a packaging regression stayed invisible
  # until the day a release was cut -- which is how every release so far broke.
  build_package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.13" ]

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build package
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Report distribution sizes
        # An sdist that suddenly balloons means a build dependency re-enabled
        # VCS file discovery and swept examples/ and docs/ back in.
        run: ls -lh dist/
      - name: Install the built wheel and import braincell
        # Import from outside the checkout: the repository root contains a
        # braincell/ source directory that would otherwise shadow the wheel.
        run: |
          python -m pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          python -c "import braincell; from braincell.experimental import optim; print(braincell.__file__, braincell.__version__, optim.__all__)"

  test_linux_neuron_compare_cable:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.13" ]

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}
      - uses: actions/checkout@v7
      - name: Print concurrency group
        run: echo '${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}'
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip cache purge
          python -m pip install --upgrade pip setuptools --no-cache-dir
          python -m pip install -r requirements-dev.txt --no-cache-dir
          python -m pip install neuron --no-cache-dir
          python -m pip install pandas --no-cache-dir
          pip install . --no-cache-dir
      - name: Test Linux-only cable neuron_compare suite
        run: |
          pytest validation/neuron/cable/tests

  # Single-channel BrainCell/NEURON comparisons (validation/neuron/channel_no_conc)
  # with the shared clamp, tolerance, convergence and build modules, then the
  # ion pool comparisons (validation/neuron/ion) in their own process. A separate
  # job, so its NEURON mechanism libraries never share a process with the cable
  # suite's. It runs on every pull request; modules marked `slow` (such as the
  # per-family dt convergence tests) run in `slow_tests_neuron` instead.
  test_linux_neuron_compare_channel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.13" ]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -r requirements-dev.txt
          python -m pip install neuron pandas
          python -m pip install .
      - name: Compile the channel mechanisms
        run: |
          for model in bc_ma2025 dcn_su2015 goc_ma2020 grc_ma2020 io_zh2019 pc_ma2024 sc_ma2021 testing; do
            python -m validation.neuron._mechanisms "$model" --kind channel > /dev/null
          done
      - name: Test the channel_no_conc suite (fast tier)
        run: |
          pytest validation/neuron/channel_no_conc/tests \
            validation/neuron/_clamp_test.py validation/neuron/_tolerance_test.py \
            validation/neuron/_convergence_test.py validation/neuron/_mechanisms_test.py \
            -m "not slow" --durations=10
      - name: Test the ion suite (fast tier)
        # Its own process, like the daily tier. pytest exits 5 when it
        # collects no test, which is not a failure.
        run: |
          status=0
          pytest validation/neuron/ion -m "not slow" --durations=10 || status=$?
          if [ "$status" -eq 5 ]; then
            echo "No fast test under validation/neuron/ion."
            exit 0
          fi
          exit "$status"

  # Tests that live outside the braincell package: the optim validation suite
  # and the benchmark scripts' own tests. Modules marked `slow` (pyproject.toml)
  # run only in the daily job below.
  test_linux_validation_benchmarks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.13" ]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -r requirements-dev.txt
          python -m pip install .
      - name: Test validation/optim and benchmarks (fast tier)
        run: |
          pytest validation/optim benchmarks -m "not slow" --durations=10

  # The slow tier of the suites above. It runs only when the daily workflow
  # (CI-daily.yml) calls this file: inside a called workflow `github.event_name`
  # is the caller's event. It is not in ci-ok's `needs` (it is skipped on pull
  # requests); a failure still fails the daily run.
  slow_tests:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.13" ]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -r requirements-dev.txt
          python -m pip install .
      - name: Test validation/optim and benchmarks (slow tier)
        run: pytest validation/optim benchmarks -m slow --durations=10

  # The slow tier of the NEURON comparison suites: every module marked `slow`
  # under validation/neuron/channel_no_conc/tests and validation/neuron/ion,
  # selected by marker, so a new slow module joins without editing this file.
  # Like `slow_tests`, it runs only when the daily workflow calls this file and
  # is not in ci-ok's `needs`; a failure fails the daily run, which opens the
  # red issue. Each suite runs in its own process (mechanism libraries).
  slow_tests_neuron:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.13" ]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -r requirements-dev.txt
          python -m pip install neuron pandas
          python -m pip install .
      - name: Compile the channel mechanisms
        run: |
          for model in bc_ma2025 dcn_su2015 goc_ma2020 grc_ma2020 io_zh2019 pc_ma2024 sc_ma2021 testing; do
            python -m validation.neuron._mechanisms "$model" --kind channel > /dev/null
          done
      - name: Test the channel_no_conc suite (slow tier)
        run: pytest validation/neuron/channel_no_conc/tests -m slow --durations=10
      - name: Test the ion suite (slow tier)
        # pytest exits 5 when it collects no test: validation/neuron/ion has
        # no slow module yet, which is not a failure.
        run: |
          status=0
          pytest validation/neuron/ion -m slow --durations=10 || status=$?
          if [ "$status" -eq 5 ]; then
            echo "No slow test under validation/neuron/ion."
            exit 0
          fi
          exit "$status"

  test_macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.13" ]

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}
      - uses: actions/checkout@v7
      - name: Print concurrency group
        run: echo '${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}'
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip cache purge
          python -m pip install --upgrade pip setuptools --no-cache-dir
          python -m pip install -r requirements-dev.txt  --no-cache-dir
          pip install .
      - name: Test with pytest
        run: |
          pytest braincell/


  test_windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.13" ]

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}
      - uses: actions/checkout@v7
      - name: Print concurrency group
        run: echo '${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}'
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip cache purge
          python -m pip install --upgrade pip setuptools --no-cache-dir
          python -m pip install -r requirements-dev.txt  --no-cache-dir
          pip install .  --no-cache-dir
      - name: Test with pytest
        run: |
          pytest braincell/ -p no:faulthandler

  # One Python version (3.13), against the JAX floor (0.11.0) and the latest
  # release (""). Every job in this file uses the same Python. The
  # `pyproject.toml` classifiers are written by hand
  # (`generate_python_version_classifiers = false`) and list the supported
  # versions; the `lint` job fails if a version tested here is not among them.
  test_linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        jax-version: ["0.11.0", ""]

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}
      - uses: actions/checkout@v7
      - name: Print concurrency group
        run: echo '${{ github.workflow }}-${{ github.ref }}'
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip cache purge
          python -m pip install --upgrade pip setuptools
          python -m pip install -r requirements-dev.txt
          if [ "${{ matrix.jax-version }}" == "" ]; then
            python -m pip install jax || exit 1
          else
            python -m pip install jax==${{ matrix.jax-version }} || exit 1
          fi
          python -m pip install . || exit 1
      - name: Test with pytest
        run: |
          pytest braincell/

  # Coverage of braincell/ on the latest jax, gated in two tiers: the total
  # must stay at or above `fail_under` in pyproject.toml's [tool.coverage]
  # (pytest-cov applies it), and on a pull request the lines it adds or changes
  # must be at least 90 % covered (diff-cover against origin/main).
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # diff-cover needs origin/main
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        # Editable, so the measured files are the checkout's paths that
        # diff-cover matches against the git diff.
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -r requirements-dev.txt jax pytest-cov
          python -m pip install -e .
      - name: Test with coverage
        run: |
          pytest braincell/ --cov=braincell --cov-report=xml --cov-report=term
      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
      - name: Require 90 % coverage of the lines this pull request changes
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          python -m pip install diff-cover
          diff-cover coverage.xml --compare-branch=origin/main --fail-under=90

  # Build the documentation the way a release does (deploy-docs.yml), with
  # every warning an error: a broken link, cross-reference or toctree entry
  # fails the pull request instead of the release. --keep-going lists all
  # warnings in one run. Serial on purpose: `sphinx -j` forks a process after
  # JAX has started its threads and deadlocks. Notebooks are not executed
  # (nb_execution_mode = "off" in docs/conf.py). The page header and the
  # intersphinx inventories are downloaded live.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[doc]"
      - name: Build the documentation, warnings as errors
        env:
          BRAINX_HEADER_TTL: "0"
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html

  # The single required status check of the main branch ruleset. It needs
  # every job above, so adding a job or renaming a matrix entry never touches
  # the ruleset. Any result other than success (failure, cancelled, skipped)
  # fails it.
  ci-ok:
    if: always()
    # One job per line, so pull requests that add jobs do not conflict here.
    needs:
      - lint
      - build_package
      - docs
      - test_linux
      - test_linux_neuron_compare_cable
      - test_linux_neuron_compare_channel
      - test_linux_validation_benchmarks
      - test_macos
      - test_windows
      - coverage
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
