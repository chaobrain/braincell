# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Continuous Integration

# Runs on every pull request and on main after a merge. The daily workflow
# (CI-daily.yml) calls this same file, so both test one definition. A
# `push: '**'` trigger would test every pull request twice: push and
# pull_request runs fall into different concurrency groups.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_call:


permissions:
  contents: read  # to fetch code
  actions: write  # to cancel previous workflows


# This is what will cancel the workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  # Every pre-commit hook on every file (.pre-commit-config.yaml): ruff,
  # formatting, and the repository checks.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pre-commit
        run: python -m pip install "pre-commit>=2.8"
      - name: Run every hook on every file
        run: pre-commit run --all-files --show-diff-on-failure

  # Exercise the packaging path on every push. Publish.yml only builds on a
  # release, so before this job existed a packaging regression stayed invisible
  # until the day a release was cut -- which is how every release so far broke.
  build_package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.13" ]

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build package
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Report distribution sizes
        # An sdist that suddenly balloons means a build dependency re-enabled
        # VCS file discovery and swept examples/ and docs/ back in.
        run: ls -lh dist/
      - name: Install the built wheel and import braincell
        # Import from outside the checkout: the repository root contains a
        # braincell/ source directory that would otherwise shadow the wheel.
        run: |
          python -m pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          python -c "import braincell; from braincell.experimental import optim; print(braincell.__file__, braincell.__version__, optim.__all__)"

  test_linux_neuron_compare_cable:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.13" ]

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}
      - uses: actions/checkout@v7
      - name: Print concurrency group
        run: echo '${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}'
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip cache purge
          python -m pip install --upgrade pip setuptools --no-cache-dir
          python -m pip install -r requirements-dev.txt --no-cache-dir
          python -m pip install neuron --no-cache-dir
          python -m pip install pandas --no-cache-dir
          pip install . --no-cache-dir
      - name: Test Linux-only cable neuron_compare suite
        run: |
          pytest validation/neuron/cable/tests

  test_macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.13" ]

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}
      - uses: actions/checkout@v7
      - name: Print concurrency group
        run: echo '${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}'
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip cache purge
          python -m pip install --upgrade pip setuptools --no-cache-dir
          python -m pip install -r requirements-dev.txt  --no-cache-dir
          pip install .
      - name: Test with pytest
        run: |
          pytest braincell/


  test_windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.13" ]

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}
      - uses: actions/checkout@v7
      - name: Print concurrency group
        run: echo '${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}'
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip cache purge
          python -m pip install --upgrade pip setuptools --no-cache-dir
          python -m pip install -r requirements-dev.txt  --no-cache-dir
          pip install .  --no-cache-dir
      - name: Test with pytest
        run: |
          pytest braincell/ -p no:faulthandler

  # The matrix covers the oldest and the newest Python declared in
  # pyproject.toml (classifiers and `requires-python`) and, for JAX, the floor
  # and the latest release (""). jaxlib 0.9.0 ships no CPython 3.15 wheels, so
  # that one pair is excluded. Keep the classifiers equal to the Python
  # versions listed here.
  test_linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.15"]
        jax-version: ["0.9.0", ""]
        exclude:
          - python-version: "3.15"
            jax-version: "0.9.0"

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}
      - uses: actions/checkout@v7
      - name: Print concurrency group
        run: echo '${{ github.workflow }}-${{ github.ref }}'
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip cache purge
          python -m pip install --upgrade pip setuptools
          python -m pip install -r requirements-dev.txt
          if [ "${{ matrix.jax-version }}" == "" ]; then
            python -m pip install jax || exit 1
          else
            python -m pip install jax==${{ matrix.jax-version }} || exit 1
          fi
          python -m pip install . || exit 1
      - name: Test with pytest
        run: |
          pytest braincell/

  # Coverage of braincell/ on the latest jax, gated in two tiers: the total
  # must stay at or above `fail_under` in pyproject.toml's [tool.coverage]
  # (pytest-cov applies it), and on a pull request the lines it adds or changes
  # must be at least 90 % covered (diff-cover against origin/main).
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # diff-cover needs origin/main
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        # Editable, so the measured files are the checkout's paths that
        # diff-cover matches against the git diff.
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -r requirements-dev.txt jax pytest-cov
          python -m pip install -e .
      - name: Test with coverage
        run: |
          pytest braincell/ --cov=braincell --cov-report=xml --cov-report=term
      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
      - name: Require 90 % coverage of the lines this pull request changes
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          python -m pip install diff-cover
          diff-cover coverage.xml --compare-branch=origin/main --fail-under=90

  # The single required status check of the main branch ruleset. It needs
  # every job above, so adding a job or renaming a matrix entry never touches
  # the ruleset. Any result other than success (failure, cancelled, skipped)
  # fails it.
  ci-ok:
    if: always()
    needs: [ lint, build_package, test_linux, test_linux_neuron_compare_cable, test_macos, test_windows, coverage ]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
