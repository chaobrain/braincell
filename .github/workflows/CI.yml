# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Continuous Integration

# Runs on every pull request and on each merge-queue group (merge_group: main
# plus the queued pull requests, which is what the queue merges). A draft pull
# request runs only `ci-ok`, which fails; marking it ready for review starts
# the run. There is no run on main after a merge: the daily workflow
# (CI-daily.yml) calls this same file, so both test one definition, and tests
# main every day. On a pull request, the `changes` job skips the test jobs its
# files cannot affect (.github/ci_changes.py).
on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
  merge_group:
  workflow_call:


permissions:
  contents: read  # to fetch code
  actions: write  # to cancel previous workflows


# This is what will cancel the workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  # Which test jobs this event needs. On a pull request, from the files it
  # changes (.github/ci_changes.py; the checkout is the merge commit, whose
  # first parent is the base, so the diff is the pull request's change; CI and
  # build inputs select every job). Any other event selects every job.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      braincell: ${{ steps.filter.outputs.braincell }}
      neuron: ${{ steps.filter.outputs.neuron }}
      bench: ${{ steps.filter.outputs.bench }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the selection rules
        run: python3 .github/ci_changes.py --self-test
      - id: filter
        name: Select the jobs
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only "$BASE" HEAD | python3 .github/ci_changes.py | tee -a "$GITHUB_OUTPUT"
          else
            python3 .github/ci_changes.py --all < /dev/null | tee -a "$GITHUB_OUTPUT"
          fi

  # The checks that need no test run, in one job so a pull request holds one
  # runner for them: every pre-commit hook on every file
  # (.pre-commit-config.yaml); the package build (Publish.yml only builds on a
  # release, so before this step existed a packaging regression stayed
  # invisible until the day a release was cut -- which is how every release so
  # far broke); and the documentation built the way a release does
  # (deploy-docs.yml) with every warning an error, so a broken link,
  # cross-reference or toctree entry fails the pull request instead of the
  # release. --keep-going lists all warnings in one run. Serial on purpose:
  # `sphinx -j` forks a process after JAX has started its threads and
  # deadlocks. Notebooks are not executed (nb_execution_mode = "off" in
  # docs/conf.py). The page header and the intersphinx inventories are
  # downloaded live. Last, the `>>>` examples in the package's docstrings run
  # as doctests (test modules excluded), so an example that no longer matches
  # the code fails the pull request. Runs on every pull request.
  checks:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pre-commit
        run: python -m pip install "pre-commit>=2.8"
      - name: Run every hook on every file
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Require every tested Python version to be a declared classifier
        run: |
          python -m pip install pyyaml
          python - <<'EOF'
          import tomllib
          import yaml

          def tested(node):
              # Every `python-version` value in the workflow, lists and scalars.
              if isinstance(node, dict):
                  for key, value in node.items():
                      if key == "python-version":
                          for v in value if isinstance(value, list) else [value]:
                              if "{{" not in str(v):  # a matrix expression
                                  yield str(v)
                      else:
                          yield from tested(value)
              elif isinstance(node, list):
                  for item in node:
                      yield from tested(item)

          with open(".github/workflows/CI.yml") as f:
              ci = set(tested(yaml.safe_load(f)))
          with open("pyproject.toml", "rb") as f:
              classifiers = tomllib.load(f)["project"]["classifiers"]
          prefix = "Programming Language :: Python :: "
          declared = {c[len(prefix):] for c in classifiers
                      if c.startswith(prefix) and c[len(prefix):].startswith("3.")}
          print("tested in CI.yml:", sorted(ci))
          print("classifiers:     ", sorted(declared))
          if not ci or not ci <= declared:
              raise SystemExit(
                  f"CI.yml tests Python versions missing from the classifiers: {sorted(ci - declared)}")
          EOF
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build package
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Report distribution sizes
        # An sdist that suddenly balloons means a build dependency re-enabled
        # VCS file discovery and swept examples/ and docs/ back in.
        run: ls -lh dist/
      - name: Install the built wheel and import braincell
        # Import from outside the checkout: the repository root contains a
        # braincell/ source directory that would otherwise shadow the wheel.
        run: |
          python -m pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          python -c "import braincell; from braincell.experimental import optim; print(braincell.__file__, braincell.__version__, optim.__all__)"
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[doc]"
      - name: Build the documentation, warnings as errors
        env:
          BRAINX_HEADER_TTL: "0"
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - name: Run the docstring examples
        # Collecting every module needs the test dependencies (pytest and the
        # optional imports); the root conftest.py selects the CPU.
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest --doctest-modules braincell --ignore-glob='*_test.py' -rs --durations=5

  # The tests outside the braincell package, in one job so a pull request
  # holds one runner for them; each suite runs in its own pytest process, so
  # the NEURON mechanism libraries of the cable, channel and ion suites never
  # share a process. Steps are selected by `changes`: the NEURON comparisons
  # (validation/neuron, and the ASC reader's NEURON parity tests) when
  # `neuron`, the optim validation suite and the benchmark scripts' own tests
  # when `bench`. Every selected step runs even after an earlier one failed,
  # so one run reports every failure. Modules marked `slow` (pyproject.toml)
  # run only in `slow_tests` and `slow_tests_neuron`. The morphology, ASC and
  # synapse comparisons skip their tests when NEURON cannot be imported, and
  # the ion suite's when a pinned source under data/modeldb is missing; here
  # a skipped test fails the job (.github/junit_counts.py), so a broken NEURON
  # install or a lost file cannot turn them into silent passes.
  validation:
    needs: changes
    if: needs.changes.outputs.neuron == 'true' || needs.changes.outputs.bench == 'true'
    runs-on: ubuntu-latest
    env:
      NEURON_SUITES: ${{ needs.changes.outputs.neuron }}
      BENCH_SUITES: ${{ needs.changes.outputs.bench }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -r requirements-dev.txt
          python -m pip install neuron pandas
          python -m pip install .
      - name: Compile the channel mechanisms
        if: env.NEURON_SUITES == 'true'
        run: |
          for model in bc_ma2025 dcn_su2015 goc_ma2020 grc_ma2020 io_zh2019 pc_ma2024 sc_ma2021 testing; do
            python -m validation.neuron._mechanisms "$model" --kind channel > /dev/null
          done
      - name: Test the cable suite
        if: ${{ !cancelled() && env.NEURON_SUITES == 'true' }}
        run: pytest validation/neuron/cable/tests --durations=10
      - name: Test the channel_no_conc suite (fast tier)
        if: ${{ !cancelled() && env.NEURON_SUITES == 'true' }}
        run: |
          pytest validation/neuron/channel_no_conc/tests \
            validation/neuron/_clamp_test.py validation/neuron/_tolerance_test.py \
            validation/neuron/_convergence_test.py validation/neuron/_mechanisms_test.py \
            validation/neuron/_paths_test.py -m "not slow" --durations=10
      - name: Test the ion suite (fast tier)
        if: ${{ !cancelled() && env.NEURON_SUITES == 'true' }}
        run: pytest validation/neuron/ion -m "not slow" -rs --durations=10 --junitxml="$RUNNER_TEMP/neuron-ion.xml"
      - name: Test the morphology comparisons
        # SWC and ASC morphology metrics and soma layout against NEURON's
        # import3d; NEURON's built-in mechanisms only, no compiled models.
        if: ${{ !cancelled() && env.NEURON_SUITES == 'true' }}
        run: pytest validation/neuron/morph -rs --durations=10 --junitxml="$RUNNER_TEMP/neuron-morph.xml"
      - name: Test the ASC reader against NEURON (AscNeuronParityTest)
        # The package suite has no NEURON, so these tests skip in `coverage`.
        if: ${{ !cancelled() && env.NEURON_SUITES == 'true' }}
        run: pytest braincell/io/asc/reader_test.py -k AscNeuronParityTest -rs --durations=10 --junitxml="$RUNNER_TEMP/neuron-asc.xml"
      - name: Test the synapse comparisons
        # ExpSyn and Exp2Syn, NetCon delays and spike times against NEURON's
        # built-in mechanisms; no compiled models.
        if: ${{ !cancelled() && env.NEURON_SUITES == 'true' }}
        run: pytest validation/neuron/synapse -rs --durations=10 --junitxml="$RUNNER_TEMP/neuron-synapse.xml"
      - name: Require the morphology, ASC, synapse and ion comparisons to skip no test
        if: ${{ !cancelled() && env.NEURON_SUITES == 'true' }}
        run: |
          python .github/junit_counts.py --self-test
          python .github/junit_counts.py "$RUNNER_TEMP"/neuron-morph.xml "$RUNNER_TEMP"/neuron-asc.xml \
            "$RUNNER_TEMP"/neuron-synapse.xml "$RUNNER_TEMP"/neuron-ion.xml
      - name: Test validation/optim and benchmarks (fast tier)
        if: ${{ !cancelled() && env.BENCH_SUITES == 'true' }}
        run: pytest validation/optim benchmarks -m "not slow" --durations=10

  # The slow tier of the suites above. It runs only when the daily workflow
  # (CI-daily.yml) calls this file: inside a called workflow `github.event_name`
  # is the caller's event. It is not in ci-ok's `needs` (it is skipped on pull
  # requests); a failure still fails the daily run.
  slow_tests:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.13" ]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -r requirements-dev.txt
          python -m pip install .
      - name: Test validation/optim and benchmarks (slow tier)
        run: pytest validation/optim benchmarks -m slow --durations=10

  # The slow tier of the NEURON comparison suites: every module marked `slow`
  # under validation/neuron/channel_no_conc/tests and validation/neuron/ion,
  # selected by marker, so a new slow module joins without editing this file.
  # Like `slow_tests`, it runs only when the daily workflow calls this file and
  # is not in ci-ok's `needs`; a failure fails the daily run, which opens the
  # red issue. Each suite runs in its own process (mechanism libraries). The
  # ion suite compiles its own sources, the pinned ModelDB files under
  # data/modeldb included (the chloride, GABA_A, sodium and potassium
  # comparisons), and must skip no test. It also compiles every
  # cerebellar model's whole-cell mechanisms, which no suite on a pull
  # request builds.
  slow_tests_neuron:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.13" ]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -r requirements-dev.txt
          python -m pip install neuron pandas
          python -m pip install .
      - name: Compile the channel mechanisms
        run: |
          for model in bc_ma2025 dcn_su2015 goc_ma2020 grc_ma2020 io_zh2019 pc_ma2024 sc_ma2021 testing; do
            python -m validation.neuron._mechanisms "$model" --kind channel > /dev/null
          done
      - name: Test the channel_no_conc suite (slow tier)
        run: pytest validation/neuron/channel_no_conc/tests -m slow --durations=10
      - name: Test the ion suite (slow tier)
        # Runs after a failed step too, so one suite's failure cannot hide the other's.
        if: ${{ !cancelled() }}
        run: pytest validation/neuron/ion -m slow -rs --durations=10 --junitxml="$RUNNER_TEMP/neuron-ion-slow.xml"
      - name: Require the ion suite (slow tier) to skip no test
        if: ${{ !cancelled() }}
        run: python .github/junit_counts.py "$RUNNER_TEMP/neuron-ion-slow.xml"
      - name: Compile the whole-cell mechanisms
        # The channel builds above leave each model's ion and synapse MOD
        # files uncompiled; a cell build compiles channel, ion and synapse
        # sources together. Runs after a failed step too, and reports every
        # model that fails to build.
        if: ${{ !cancelled() }}
        run: |
          status=0
          for model in bc_ma2025 dcn_su2015 goc_ma2020 grc_ma2020 io_zh2019 pc_ma2024 sc_ma2021; do
            if ! python -m validation.neuron._mechanisms "$model" --kind cell > /dev/null; then
              echo "::error::The $model whole-cell mechanisms do not compile."
              status=1
            fi
          done
          exit "$status"

  # macOS and Windows run only in the daily workflow (like `slow_tests`), to
  # keep pull requests within the account's concurrent-job limit (macOS runners
  # are the scarcest). They are not in ci-ok's `needs`; a failure fails the
  # daily run, which opens the red issue.
  test_macos:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.13" ]

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}
      - uses: actions/checkout@v7
      - name: Print concurrency group
        run: echo '${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}'
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -r requirements-dev.txt
          pip install .
      - name: Test with pytest
        run: |
          pytest braincell/


  test_windows:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.13" ]

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}
      - uses: actions/checkout@v7
      - name: Print concurrency group
        run: echo '${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}'
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -r requirements-dev.txt
          pip install .
      - name: Test with pytest
        run: |
          pytest braincell/ -p no:faulthandler

  # The package suite against the JAX floor (0.11.0), only in the daily run
  # (like `slow_tests`); `coverage` runs it on the latest JAX on every pull
  # request. Every job in this file uses Python 3.13. The `pyproject.toml`
  # classifiers are written by hand (`generate_python_version_classifiers =
  # false`) and list the supported versions; the `checks` job fails if a
  # version tested here is not among them.
  test_linux:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        jax-version: ["0.11.0"]

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}
      - uses: actions/checkout@v7
      - name: Print concurrency group
        run: echo '${{ github.workflow }}-${{ github.ref }}'
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -r requirements-dev.txt pytest-xdist
          python -m pip install jax==${{ matrix.jax-version }} || exit 1
          python -m pip install . || exit 1
      - name: Test with pytest
        # One worker per CPU, whole files per worker, as in `coverage`. A
        # single process ran for about an hour and its runner was shut down
        # three daily runs in a row (2026-11-14) at 51-65 min, before the
        # suite finished; four smaller processes finish in about a third of
        # the time.
        run: |
          pytest braincell/ -n auto --dist loadfile --durations=30

  # Coverage of braincell/ on the latest jax, gated in two tiers: the total
  # must stay at or above `fail_under` in pyproject.toml's [tool.coverage],
  # and on a pull request the lines it adds or changes must be at least 90 %
  # covered (diff-cover against origin/main). The tests run as three shards in
  # parallel (.github/ci_shards.py balances the test files by the seconds in
  # .github/test_durations.json; each collected file runs in exactly one
  # shard); `coverage-report` combines their data and applies both gates.
  coverage:
    needs: changes
    if: needs.changes.outputs.braincell == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [ 0, 1, 2 ]
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Install dependencies
        # Editable, so the measured files are the checkout's paths that
        # diff-cover matches against the git diff.
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -r requirements-dev.txt jax pytest-cov pytest-xdist
          python -m pip install -e .
      - name: Check the shard assignment
        run: python .github/ci_shards.py --self-test
      - name: Test with coverage (shard ${{ matrix.shard }} of 3)
        # One worker per CPU; whole files per worker, so a file's tests keep
        # their order. pytest-cov merges the workers' data into .coverage; the
        # floor applies to the combined data, not to one shard.
        env:
          BRAINCELL_TEST_SHARD: ${{ matrix.shard }}/3
        run: |
          pytest braincell/ -n auto --dist loadfile --cov=braincell --cov-report= --cov-fail-under=0 \
            --durations=30 --junitxml="junit-shard-${{ matrix.shard }}.xml"
      - name: Upload the coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ matrix.shard }}
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload the JUnit report (input to ci_shards.py --update)
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: junit-shard-${{ matrix.shard }}
          path: junit-shard-${{ matrix.shard }}.xml
          if-no-files-found: warn

  coverage-report:
    needs: coverage
    if: needs.coverage.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # diff-cover needs origin/main
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install coverage and diff-cover
        run: python -m pip install pytest-cov diff-cover
      - name: Download the shards' coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
      - name: Combine the shards and require the total floor
        # `coverage report` applies `fail_under` from pyproject.toml. `-i`
        # skips files with no source (a test executes code under a made-up
        # braincell/fake.py), as pytest-cov's own reports do.
        run: |
          for i in 0 1 2; do mv "coverage-data-$i/.coverage" ".coverage.shard$i"; done
          coverage combine
          coverage xml -i
          coverage report -i
      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        # The report is for reading only and gates nothing; GitHub's artifact
        # service sometimes answers with an HTML error page, which must not
        # fail ci-ok.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
      - name: Require 90 % coverage of the lines this pull request changes
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: diff-cover coverage.xml --compare-branch=origin/main --fail-under=90

  # The single required status check of the main branch ruleset. `changes`
  # must succeed, so a skipped test job always means "its files did not
  # change", never "a job it needs failed"; every other job must succeed or be
  # skipped by its path condition. On a draft pull request it fails (GitHub
  # counts a skipped required check as passed). The daily-only jobs
  # (`test_linux`, the slow tiers, macOS, Windows) are not listed; a failure
  # fails the daily run, which opens the red issue.
  ci-ok:
    if: always()
    # One job per line, so pull requests that add jobs do not conflict here.
    needs:
      - changes
      - checks
      - validation
      - coverage
      - coverage-report
    runs-on: ubuntu-latest
    steps:
      - name: Require `changes` to succeed and every other job to succeed or be skipped
        env:
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [ "$DRAFT" = true ]; then
            echo "Draft pull request: mark it ready for review to run CI."
            exit 1
          fi
          echo "changes: $CHANGES; job results: $RESULTS"
          [ "$CHANGES" = success ] || exit 1
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
