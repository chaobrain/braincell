# What the daily `examples` job does not run (.github/run_examples.py).
#
# Every other tracked examples/**/*.py that is not a *_test.py, __init__.py or
# conftest.py runs with MPLBACKEND=Agg on CPU, with the job's dependencies
# (requirements-dev.txt: braincell[testing]). List a script here only when it
# cannot run there: it needs a package that install does not provide, a GPU,
# the network or command-line arguments for a long experiment, or it is not
# Python. Give the reason; an entry for a file that is not a tracked example
# script fails the job. A script that is merely slow gets a [[timeout]] entry
# instead.

